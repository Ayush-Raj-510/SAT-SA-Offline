# Render blueprint — free-tier deployment of the FastAPI backend + PostgreSQL.
# Deploy: Render Dashboard → New → Blueprint → point at this repository.
# The Vercel frontend is deployed separately; set its VITE_API_ORIGIN to the
# Render service URL this file creates, and set the backend's ALLOWED_ORIGINS
# to the Vercel URL(s).
services:
  - type: web
    name: sat-sa-api
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    # Free instances sleep; the first request after a nap takes ~30-60s.
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sat-sa-db
          property: connectionString
      # Comma-separated exact origins. After the first Vercel deploy, put the
      # production URL here (Render → Environment):
      #   https://sat-sa.vercel.app
      - key: ALLOWED_ORIGINS
        value: "http://localhost:3000,http://localhost:3001"
      # Optional: allow every *.vercel.app preview of this project.
      - key: ALLOWED_ORIGIN_SUFFIXES
        value: ".vercel.app"
      # The free tier has no GPU and a container that cannot run Ollama in
      # process; keep the AI bridge off unless you point it at a hosted
      # Ollama-compatible endpoint (e.g. a paid VM or an Ollama host you run).
      - key: OLLAMA_ENABLED
        value: "false"

databases:
  - name: sat-sa-db
    plan: free
    databaseName: satsa
    user: satsa
